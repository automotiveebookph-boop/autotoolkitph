faqs:
  - q: Ano ang pagkakaiba nito sa ₱499 na Zero to Tech?
    a: 'Ang ₱499 Zero to Tech ay ang 10-module training na kasama ang Service Menu Kit. Ang PRO ay may dagdag na Pro Pack: Diesel at Aircon modules, 8 diagram sheets, 20 quote practice na kaso, at ang Dalhin sa Boss at Sideline Starter.'
  - q: Kasama ba ang Service Menu Kit?
    a: 'Oo. Kasama ang Price Book, Service Booklet, Messenger Reply Pack at PMS Quote Calculator. Ang Quote Practice Workbook ay gumagamit ng Price Book na ito.'
  - q: Kailangan ko ba ng computer?
    a: 'Hindi. Mabubuksan ang mga PDF sa phone. Ang mga fillable PDF ay para sa Adobe Acrobat Reader (libre), o i-print. Ang Excel files ay para sa computer.'
  - q: Gaano kalalim ang diesel at aircon modules?
    a: 'Basics ng diagnosis: paano gumagana, safety, unang test, pagbasa ng live data o gauges, at kailan mag-refer. Hindi nito pinapalitan ang training at service manual, lalo na sa high-pressure fuel at refrigerant.'
  - q: Puwede ba ito sa sideline o home service?
    a: 'Oo. May gabay kung anong trabaho ang bagay sa home service, ligtas na paggawa, quote card, at 10 Messenger replies. Basahin muna ang patakaran ng employer mo bago magsimula.'
  - q: Paano ko makukuha?
    a: Pagka-verify ng bayad, ise-send namin ang download link dito sa Messenger.

