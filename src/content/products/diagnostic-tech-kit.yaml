trust:
  heading: Ano ang makukuha mo
  items:
    - Self-assessment para malaman kung saang module ka magsisimula
    - Drill at quiz sa bawat module, may answer key
    - Phone version para mabasa kahit nasa ilalim ng sasakyan
    - 'Kasama: Service Menu Kit para presyuhan nang tama ang trabaho mo'

problem:
  heading: '"Palitan na lang natin." Ilang beses mo na itong narinig?'
  body: 'Kapag hindi marunong mag-test, nanghuhula: bagong battery, bagong sensor, bagong alternator, at bumabalik pa rin ang sasakyan. Sayang ang pera ng customer, ang oras mo, at ang tiwala ng boss mo. Karamihan ng sira ngayon ay electrical, at ito ang pinakakinatatakutan ng maraming mekaniko.'
  bullets:
    - Takot sa multimeter at wiring diagram
    - Nagpapalit ng parts dahil sa code, hindi dahil sa test
    - Hindi alam kung paano basahin ang live data at fuel trims
    - Walang malinaw na daan papunta sa NC II at sa mas magandang posisyon

modulesHeading: 10 modules. Mula basics hanggang diagnosis.
modules:
  - number: '01'
    title: Foundations
    description: Shop safety, paano gumagana ang sasakyan, tools, torque at fluids
  - number: '02'
    title: PMS Mastery
    description: Change oil, brake pads, 20-point inspection, at paano iwasan ang mga karaniwang comeback
  - number: '03'
    title: Electrical Fundamentals
    description: Ohm's Law, multimeter, voltage drop test, battery, charging at parasitic draw
  - number: '04'
    title: Reading Wiring Diagrams
    description: Simbolo, wire color codes, relay pins at ang "split the circuit" method
  - number: '05'
    title: Sensors and Engine Management
    description: Paano i-test ang 3-wire sensor, thermistor, crank, cam, O2 at A/F sensor
  - number: '06'
    title: Scan Tool and Live Data
    description: Codes, freeze frame, normal na live data at fuel trims
  - number: '07'
    title: Diagnostic Case Files
    description: Ang 7-step diagnostic process, 6 practice cases at 3 mystery cases
  - number: '08'
    title: Modern Vehicles
    description: Hybrid safety, CVT, CAN bus, ADAS at EV basics
  - number: '09'
    title: Career and Money
    description: TESDA NC II step by step, resume, interview, raise, tools, at ligtas na daan papunta sa abroad
  - number: '10'
    title: The Trusted Tech
    description: Tapat na rekomendasyon, paano ipaliwanag ang repair sa customer, at work ethic
  - number: KASAMA
    title: Service Menu & Price List Kit
    description: 'Price Book (service menu, 170 labor prices, PMS cards 5K–80K), Service Booklet para sa customer, Messenger replies at PMS Quote Calculator. Para sa sideline, home service o sariling shop: pangalan mo, presyo mo'
  - number: BONUS
    title: Diagnostic Tech Toolkit
    description: 'Phone version, 8 quick-reference spec cards (phone + print), Drill & Quiz Workbook na may Final Assessment sign-off, Case Log, Resume template (Word) at Career Scripts'

