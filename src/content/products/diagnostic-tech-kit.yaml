creatorNoteHeading: Sino ang gumawa nito?
creatorNote:
  - Isinulat mula sa hands-on shop experience at sa karaniwang diagnostic practice ng mga technician.
  - Ang mga spec ay typical values. Laging sundin ang service manual ng mismong sasakyan. Ang mga practice case ay halimbawang training scenario, hindi tunay na job.

howToOrder:
  - I-message kami sa Messenger
  - Magbayad via GCash gamit ang details na ise-send namin
  - Matanggap ang download link sa Messenger pagka-verify ng bayad

faqs:
  - q: Wala akong alam. Para sa akin ba ito?
    a: 'Oo. Magsimula ka sa Self-Assessment: kapag 0 hanggang 2 ang tick mo, sa Module 1 ka magsisimula. Kapag may alam ka na, lalaktawan mo ang basics at diretso ka sa electrical at diagnosis.'
  - q: Wala pa akong trabaho sa shop. Makakatulong ba ito?
    a: 'Oo, pero totoo tayo: kailangan pa rin ng hands-on na practice sa tunay na sasakyan. Nasa kit ang mga daan papasok (helper, TESDA training na may scholarship, apprenticeship, dual training, PESO), ang puwede mong gawin habang wala ka pang shop, at kung anong posisyon ang puwede mo nang applyan pagkatapos ng bawat module.'
  - q: Kailangan ko ba ng computer?
    a: 'Hindi. May phone version ang buong kit at ang spec cards. Ang Workbook at Case Log ay fillable PDF na mabubuksan sa Adobe Acrobat Reader (libre), o i-print.'
  - q: Kailangan ko ba ng sariling scan tool o multimeter?
    a: 'Hindi agad. Simulan sa tools ng shop. Sa Module 9 may phased plan kung anong tools ang bibilhin at kailan, ayon sa module na natapos mo na.'
  - q: Makakakuha ba ako ng TESDA certificate dito?
    a: 'Hindi. Hindi kami TESDA at hindi ito TESDA course. Pero nasa Module 9 ang mga hakbang para kumuha ng NC II assessment, at ang drills ay magandang practice bago ang assessment.'
  - q: Nag-aalok ba kayo ng trabaho sa abroad?
    a: 'Hindi. Hindi kami recruitment agency. Ang Module 9 ay nagtuturo kung paano i-check kung lisensyado sa DMW ang agency at paano iwasan ang illegal recruiter.'
  - q: Bakit kasama ang Service Menu Kit?
    a: 'Para kumita ka sa natutunan mo. Sa sideline, home service o sariling shop, may handa kang service menu, 170 labor prices at PMS price list na may pangalan mo, para tama at pare-pareho ang singil mo. Ang Service Menu Kit lang ay ₱499 kapag binili nang hiwalay.'
  - q: Kasama ba ito sa Auto Service Center System?
    a: Oo. Pareho silang kasama sa System, para may training program ang mga mekaniko ng shop mo.
  - q: Paano ko makukuha?
    a: Pagka-verify ng bayad, ise-send namin ang download link dito sa Messenger.

finalCta:
  heading: '{PRICE} para tumigil sa panghuhula at magsimulang mag-test.'

disclaimer: For training only. Specifications are typical values; always follow the vehicle manufacturer's service information. High-voltage hybrid and EV work requires proper training and equipment. Practice cases are training scenarios. TESDA, DMW and the overseas programs mentioned are named only to describe common pathways; {BRAND_NAME} is not affiliated with them, is not a recruitment agency and does not offer job placement.

