creatorNoteHeading: Sino ang gumawa nito?
creatorNote:
  - Isinulat mula sa hands-on shop experience, hindi mula sa school feasibility study.
  - Hindi ito tax o legal advice. Para ito sa education at planning — laging i-verify sa DTI, BIR, LGU at iba pang ahensya bago kumilos.

howToOrder:
  - I-message kami sa Messenger
  - Magbayad via GCash gamit ang details na ise-send namin
  - Matanggap ang download link sa Messenger pagka-verify ng bayad

faqs:
  - q: Is this tax/legal advice?
    a: Hindi. Para ito sa education at planning. Laging i-verify sa DTI, BIR, LGU, DOLE, SSS, PhilHealth, Pag-IBIG at DENR bago kumilos, at kumonsulta sa lisensyadong accountant o lawyer para sa tax at legal decisions.
  - q: Updated ba ito?
    a: Oo, as of October 2026. Nagbabago ang rules, kaya laging i-confirm sa ahensya bago magbayad o mag-file.
  - q: Paano ko makukuha?
    a: Pagka-verify ng bayad, ise-send namin ang download link dito sa Messenger.

finalCta:
  heading: Huwag manghula. Simulan sa tamang roadmap.

disclaimer: 'This guide is for education and planning. Government fees, rates and procedures change and differ by LGU. Verify with DTI, BIR, your LGU, DOLE, SSS, PhilHealth, Pag-IBIG and DENR before acting. For tax and legal decisions, consult a licensed accountant or lawyer. {BRAND_NAME} is not affiliated with any government agency.'

