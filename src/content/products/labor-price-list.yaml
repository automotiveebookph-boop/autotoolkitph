creatorNoteHeading: Saan galing ang mga presyo?
creatorNote:
  - Ang mga presyo, car list at schedule ay galing sa totoong pricing system ng isang 6-bay auto service shop sa Pilipinas (2026).
  - Lahat ay pwedeng palitan. Ang oil liters ng mga pinakakaraniwang kotse ay may "Check" note mula sa manual-based sources.

howToOrder:
  - I-message kami sa Messenger
  - Magbayad via GCash gamit ang details na ise-send namin
  - Matanggap ang download link sa Messenger pagka-verify ng bayad

faqs:
  - q: Kailangan ko ba ng computer?
    a: Mas maganda sa computer (Microsoft Excel). Gumagana rin ang PMS Quote sa Excel o WPS app sa phone. Ang guide at bonus forms ay pwede sa phone.
  - q: Pwede ko bang palitan ang presyo at schedule?
    a: Oo. Editable ang PMS prices, add-ons, mileage schedule, car list at labor prices. Isang beses lang i-type; automatic na ang lahat ng quote.
  - q: Kasama ba ang piyesa sa presyo?
    a: Ang PMS at change oil packages ay kasama na ang oil at filter. Ang ilang add-ons ay labor only (hal. spark plugs, fuel filter); nakasulat ito sa quote.
  - q: Kasama ba ito sa Talyer Starter Kit o sa System?
    a: Ang Excel ay bonus sa Talyer Starter Kit, at ang buong kit ay kasama sa Auto Service Center System.
  - q: Paano ko makukuha?
    a: Pagka-verify ng bayad, ise-send namin ang download link dito sa Messenger.

