disclaimer: Prices and schedules are starting points from the pricing of one Philippine auto service shop (2026) and standard shop practice. Actual figures depend on your area, suppliers and costs. Every vehicle specification must follow the vehicle manufacturer. {BRAND_NAME} is not affiliated with any vehicle manufacturer.

