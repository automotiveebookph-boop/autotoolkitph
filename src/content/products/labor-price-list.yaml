creatorNoteHeading: Saan galing ang mga presyo?
creatorNote:
  - Ang mga presyo at PMS schedule ay galing sa totoong pricing ng isang 6-bay auto service shop sa Pilipinas (2026).
  - Panimula lang ito. Palitan ang kahit anong presyo para tugma sa lugar, supplier at gastos mo.

howToOrder:
  - I-message kami sa Messenger
  - Magbayad via GCash gamit ang details na ise-send namin
  - Matanggap ang download link sa Messenger pagka-verify ng bayad

faqs:
  - q: Kailangan ko ba ng computer?
    a: 'Hindi. Ang Service Menu, Price List at PMS chart ay fillable PDF na mabubuksan sa phone (Adobe Acrobat Reader, libre). Ang Messenger replies ay may .txt para madaling kopyahin. Ang PMS Quote Calculator ay Excel: pinakamaganda sa computer, gumagana rin sa Excel app sa phone.'
  - q: Paano gumagana ang PMS Quote Calculator?
    a: 'Piliin ang brand at model, i-type ang odometer. Lalabas ang presyo ng PMS para sa laki ng makina at langis, kung ano ang kasama, ang libreng checks sa mileage na iyon, at ang recommended services (hindi pa kasama sa total hangga''t hindi mo pinipili). May handang Messenger reply at printable quote na pipirmahan ng customer.'
  - q: Pwede ko bang palitan ang presyo?
    a: Oo. Tap lang ang presyo sa PDF para palitan, o gamitin ang Excel para palitan ang kahit ano, pati services at schedule. May blank copy rin para isulat sa kamay.
  - q: Pwede bang kayo na ang maglagay ng shop name ko?
    a: 'Oo, kasama na sa ₱499. Pagka-order, i-message lang ang shop name, contact (phone, address o Facebook page) at mga presyong gusto mong palitan. Ibabalik namin ang print-ready na Service Menu, Price List at PMS chart.'
  - q: Kasama ba ang piyesa sa presyo?
    a: Ang PMS at change oil packages ay kasama na ang oil at filter. Ang ilang services ay labor only (hal. spark plugs, brake pads); nakasulat ito sa service menu.
  - q: Kasama ba ito sa Talyer Starter Kit o sa System?
    a: Ang PMS Quote Excel ay bonus sa Talyer Starter Kit, at ang buong kit ay kasama sa Auto Service Center System.
  - q: Paano ko makukuha?
    a: Pagka-verify ng bayad, ise-send namin ang download link dito sa Messenger.

