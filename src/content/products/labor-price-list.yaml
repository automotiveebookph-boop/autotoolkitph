creatorNoteHeading: Saan galing ang mga presyo?
creatorNote:
  - Ang labor prices ay galing sa totoong price list ng isang talyer sa Pilipinas (2024). Ang 10 packages ay batay sa mga serbisyong inaalok ng mga talyer ngayon.
  - Ang parts costs ay typical na presyo sa Pilipinas (Oktubre 2026). Palitan ng presyo ng supplier mo; automatic na mag-a-update ang lahat ng package.

howToOrder:
  - I-message kami sa Messenger
  - Magbayad via GCash gamit ang details na ise-send namin
  - Matanggap ang download link sa Messenger pagka-verify ng bayad

faqs:
  - q: Kasama ba ang piyesa sa presyo ng packages?
    a: Oo, sa 10 service packages kasama na ang standard parts (langis, filter at iba pa) gamit ang parts costs na pwede mong palitan. Sa 99 labor prices, labor lang; hiwalay ang quote ng piyesa.
  - q: Pwede ko bang baguhin ang laman at presyo?
    a: Oo. Editable ang scope of work, parts, quantities, labor at markup. May isang slot din para sa sarili mong package.
  - q: Kailangan ko ba ng computer?
    a: Para sa Excel at Facebook templates, mas madali sa computer. Ang guide at fillable forms ay pwede sa phone (Adobe Acrobat Reader).
  - q: Kasama ba ito sa Talyer Starter Kit o sa System?
    a: Ang Excel (Price List + Service Menu) ay bonus sa Talyer Starter Kit. Ang buong kit ay kasama sa Auto Service Center System.
  - q: Paano ko makukuha?
    a: Pagka-verify ng bayad, ise-send namin ang download link dito sa Messenger.

finalCta:
