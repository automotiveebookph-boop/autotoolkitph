problem:
  heading: Kapag lumalaki ang talyer, ikaw pa rin ang sumasalo ng lahat.
  body: 'Maraming talyer ang may magaling na mekaniko pero walang sistema. Ang resulta, ang may-ari ang nasa counter, sa ilalim ng kotse, sa supplier at sa sweldo, sabay-sabay. Ito ang mga butas na inaayos ng system:'
  bullets:
    - Walang nakasulat na job order at approval, kaya may away sa bayad
    - Bumabalik ang kotse (comeback) at walang nakaka-alam kung bakit
    - Maraming trabaho pero kulang pa rin ang pera sa katapusan
    - Lahat ng desisyon at problema, sa may-ari pa rin bumabagsak

modulesHeading: 8 guides, isa para sa bawat role, at toolkit ang bawat isa.
modules:
  - number: '01'
    title: Talyer Starter Guide + Starter Toolkit
    description: 'Ang buong Talyer Starter Kit: permits, puhunan, labor rate, presyo, payroll at taxes, plus Business Toolkit Excel, Labor Price List at Vehicle Health Check Report'
  - number: '02'
    title: Service Advisor
    description: 'Mula tawag hanggang release at follow-up: walk-around, 3C job order, estimate, approval, complaints. Toolkit: Job Order form, 44 Messenger scripts, Follow-up Tracker, stickers at warranty cards'
  - number: '03'
    title: Technician / Mechanic Training
    description: 'Safety, diagnosis, standard steps, quality check at skills ladder mula helper hanggang senior. Toolkit: Skills Checklist, PMS checklist, QC sheet, Comeback Log, safety posters, 52 toolbox talks'
  - number: '04'
    title: Operations Manager
    description: 'Daily rhythm, bay capacity, job board, parts control at productivity. Toolkit: Job Board kit, Capacity Planner, Parts Control, Weekly Report, daily checklists'
  - number: '05'
    title: Finance
    description: 'Daily cash, receivables ng fleet at insurance, monthly P&L, 13-week cash forecast at BIR calendar. Toolkit: Cash Forecast, Receivables Tracker, cash count forms, BIR calendar'
  - number: '06'
    title: HR
    description: 'Hiring, sweldo, incentives na may comeback check, discipline at due process. Toolkit: Incentive Calculator, HR forms, House Rules (Word), 201 File Tracker'
  - number: '07'
    title: General Manager
    description: 'Weekly scorecard, management meeting, pricing review at growth decisions. Toolkit: GM Scorecard, meeting tracker, Pricing Review, Growth Calculator, Yearly Plan'
  - number: '08'
    title: Media
    description: 'Facebook Page, Google reviews, posting plan, ads na sinusukat sa dumating na kotse, at partnerships. Toolkit: 52 captions, Posting Planner, Review Kit, Media Report, Partnership Kit'

