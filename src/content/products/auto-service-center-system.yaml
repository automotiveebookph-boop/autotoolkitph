audienceHeading: Para kanino ito?
audience:
  - May talyer na at gustong patakbuhin ito na parang service center
  - May 2 o higit pang mekaniko at kailangan na ng sistema
  - Gustong may maipasa sa SA, mekaniko o manager, para hindi lahat nasa may-ari
  - Nagpaplanong magdagdag ng bay o branch

creatorNoteHeading: Sino ang gumawa nito?
creatorNote:
  - Isinulat mula sa hands-on shop experience, at inayos batay sa mga sistemang ginagamit ng dealer service centers at industry standards, inangkop sa talyer sa Pilipinas.
  - Ang bawat guide ay SOP na pwede mong ibigay sa tao mo. Kung ikaw lang muna ang gumagawa ng lahat, simulan sa Guide 1 at 2.
  - Hindi ito tax o legal advice. Para ito sa training at planning; laging i-verify sa BIR, DOLE, DTI, LGU at DENR bago kumilos.

howToOrder:
  - I-message kami sa Messenger
  - Magbayad via GCash gamit ang details na ise-send namin
  - Matanggap ang download link sa Messenger pagka-verify ng bayad

faqs:
  - q: Ano ang pagkakaiba nito sa Talyer Starter Kit?
    a: Ang Talyer Starter Kit (₱999) ay para sa pagtatayo ng talyer. Ang Auto Service Center System ay para sa pagpapatakbo at pagpapalaki nito. Kasama na rito ang buong Starter Kit, plus 7 role guides at 36 tools.
  - q: Kailangan ko ba ng computer?
    a: Mababasa ang 8 guide PDF sa phone. Ang mga toolkit (Excel, Word at fillable forms) ay mas maganda sa computer na may Microsoft Excel. Naka-ZIP ang bawat toolkit, kaya i-extract muna bago buksan.
  - q: Para lang ba sa malaking shop?
    a: Hindi. Isinulat ito para sa talyer na may 2 hanggang 10 tao, at gumagana kahit ikaw lang muna ang may hawak ng maraming role.
  - q: Pwede ko bang ibigay ang guide sa mga tauhan ko?
    a: Oo, para sa loob ng shop ninyo. Ang hindi pwede ay ibenta o i-share sa ibang shop. Naka-pangalan sa inyo ang mga guide.
  - q: Is this tax/legal advice?
    a: Hindi. Para ito sa training at planning. Laging i-verify sa BIR, DOLE, DTI, LGU, SSS, PhilHealth, Pag-IBIG at DENR, at kumonsulta sa lisensyadong accountant o lawyer para sa tax at legal decisions.
  - q: Paano ko makukuha?
    a: Pagka-verify ng bayad, ise-send namin ang download link dito sa Messenger. Valid ang link nang 30 araw.

finalCta:
  heading: Mula talyer, gawing service center.
  body: Simulan sa isang role. Idagdag ang susunod kapag handa na ang shop.

disclaimer: 'These guides are for training and planning. Laws, rates and procedures change and differ by LGU. Verify with BIR, DOLE, DTI, your LGU, SSS, PhilHealth, Pag-IBIG and DENR before acting. For tax and legal decisions, consult a licensed accountant or lawyer. Industry practices are described for education; {BRAND_NAME} is not affiliated with any carmaker, certification body or government agency.'

